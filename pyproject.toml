[project]
name = "specfuel"
version = "0.0.0"
authors = [{name = "Troy N. Smith", email = "troy.smith@uga.edu"}]
requires-python = ">= 3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pint>=0.25.3",
    "pydantic>=2.13.4",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build<0.12"]

# fuellib is developed side-by-side with specfuel as a second top-level module
[tool.uv.build-backend]
module-name = ["specfuel", "fuellib"]

# PyPI dependencies
[pypi-dependencies]
diffrax = ">=0.7.2"
equinox = ">=0.13.8"
# <0.11.1 avoids a circular-import bug in jax 0.11.1's jax._src.clusters
# package (breaks `import jax` entirely). Floor kept low so osx-64 (no
# jaxlib wheels beyond 0.4.38) can still resolve.
jax = ">=0.4.29,<0.11.1"
optax = ">=0.2.5"

# Ruff configurations
[tool.ruff]
exclude = [
    "docs",
    "**/*.ipynb"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "RUF022",   # `__all__` is not sorted
    "TID252",   # relative import
    "D203",     # confict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice at top of file
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]




[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/dev/python.exe"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_packages = ["specfuel", "fuellib"]

[[tool.importlinter.contracts]]
name = "Package Layering"
type = "layers"
layers = [
    "specfuel",
    "fuellib",
]

[[tool.importlinter.contracts]]
name = "fuellib Module Layering"
type = "layers"
layers = [
    "fuellib.data",
    "fuellib.fuel",
    "fuellib.comp",
    "fuellib.decomp",
    "fuellib.gcm",
    "fuellib.types | fuellib.units",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=specfuel",
    "--cov=fuellib",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["specfuel", "fuellib"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
